spring.application.name=fairshare

spring.config.import=optional:file:.env[.properties]

# --- Database connection ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Load lazy collections (an expense page's splits and their users) in batches instead of one query each
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# --- Flyway ---
spring.flyway.enabled=true

# --- JWT ---
fairshare.jwt.secret=${JWT_SECRET}
fairshare.jwt.expiration=${JWT_EXPIRATION:PT1H}
